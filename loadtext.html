<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Week 8</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #dbeafe;
        }

        img {
            width: 180px;
            border-radius: 10px;
        }

        #out {
            background-color: white;
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<center>

<img src="gymlogo.jpeg">

<h1>FitZone Gym</h1>

<h2>Gym Information</h2>

<button onclick="load()">Load Information</button>

<div id="out"></div>

</center>

<script>
function load() {
    fetch("notes.txt")
    .then(response => response.text())
    .then(data => {
        document.getElementById("out").innerText = data;
    });
}
</script>

</body>
</html>
