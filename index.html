<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #information {
            background-color: white;
            width: 70%;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            font-size: 20px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<center>

<img src="gymlogo.jpeg" alt="FitZone Gym Logo" width="220">

<h1 style="color: black; font-size: 40px;">
    FitZone Gym
</h1>

<h2>
    Gym Information
</h2>

<button onclick="loadInformation()">
    Load Information
</button>

<div id="information"></div>

</center>

<script>

function loadInformation() {

    fetch("notes.txt")

    .then(response => response.text())

    .then(data => {
        document.getElementById("information").innerHTML = data;
    })

    .catch(error => {
        document.getElementById("information").innerHTML =
            "Error loading information";
    });

}

</script>

</body>
</html>
