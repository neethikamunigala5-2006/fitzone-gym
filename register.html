<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Register</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
<!-- Internal CSS -->
    <style>
        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }
 h2 {
            color: darkblue;
        }
label {
            font-weight: bold;
        }
    </style>
</head>
<body>
<center>
<h1>FitZone Gym</h1>
<hr>
<h2 style="font-size: 30px;">
    Member Registration
</h2>
<form onsubmit="return validateForm()">
    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your full name"><br><br>
    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email"><br><br>
    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter your phone number"><br><br>
    <label>Age:</label><br>
    <input type="number" placeholder="Enter your age"><br><br>
    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>
    <label>Password:</label><br>
    <input type="password" placeholder="Create password"><br><br>
    <label>Confirm Password:</label><br>
    <input type="password" placeholder="Confirm password"><br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    </form>
    <br><br>
<a href="index.html">← Back to Home</a>
</center>
<script>
function validateForm() {
let name = document.querySelector('input[type="text"]').value;
let email = document.querySelector('input[type="email"]').value;
let phone = document.querySelector('input[type="tel"]').value;
let age = document.querySelector('input[type="number"]').value;
let passwords = document.querySelectorAll('input[type="password"]');
let password = passwords[0].value;
let confirmPassword = passwords[1].value;
if (name == "") {
    alert("Please enter your name");
    return false;
}
if (email == "") {
    alert("Please enter your email");
    return false;
}
if (phone.length != 10) {
    alert("Enter a valid 10-digit phone number");
    return false;
}
if (age == "" || age < 18) {
    alert("Age must be 18 or above");
    return false;
}
if (password.length < 6) {
    alert("Password must contain at least 6 characters");
    return false;
}
if (password != confirmPassword) {
    alert("Passwords do not match");
    return false;
}
alert("Registration Successful!");
return true;
}
</script>
</body>
</html>
