<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Register</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
<!-- Internal CSS -->
    <style>
        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }
 h2 {
            color: darkblue;
        }
label {
            font-weight: bold;
        }
    </style>
</head>
<body>
<center>
<h1>FitZone Gym</h1>
<hr>
<h2 style="font-size: 30px;">
    Member Registration
</h2>
<form>
    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your full name"><br><br>
    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email"><br><br>
    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter your phone number"><br><br>
    <label>Age:</label><br>
    <input type="number" placeholder="Enter your age"><br><br>
    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>
    <label>Password:</label><br>
    <input type="password" placeholder="Create password"><br><br>
    <label>Confirm Password:</label><br>
    <input type="password" placeholder="Confirm password"><br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    </form>
    <br><br>
<a href="index.html">← Back to Home</a>
</center>
</body>
</html>
