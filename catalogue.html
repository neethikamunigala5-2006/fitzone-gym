<!DOCTYPE html> 
<html> 
<head> 
    <title>FitZone Gym - Catalogue</title> 
 
    <!-- External CSS --> 
    <link rel="stylesheet" href="style.css"> 
 
    <!-- Internal CSS --> 
    <style> 
        .catalogue { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
        } 
 
        .plan { 
            background-color: white; 
            width: 220px; 
            padding: 20px; 
            border-radius: 10px; 
        } 
 
        .plan h3 { 
            color: darkblue; 
        } 
 
        .plan button { 
            background-color: darkblue; 
            color: white; 
            padding: 10px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        } 
    </style> 
</head> 
 
<body> 
 
<center> 
 
<h1>FitZone Gym</h1> 
 
<hr> 
 
<a href="index.html">Home</a> | 
<a href="login.html">Login</a> | 
<a href="register.html">Register</a> | 
<a href="catalogue.html">Catalogue</a> 
 
<hr> 
 
<h2 style="font-size: 30px; color: darkblue;"> 
    Gym Membership Catalogue 
</h2> 
 
<div class="catalogue" id="catalogue"> 
 
</div> 
 
<br><br> 
 
<a href="index.html">← Back to Home</a> 
 
</center> 
 
<!-- JavaScript --> 
<script> 

// WEEK 9 - Fetch API to parse JSON data

fetch("plans.json")
.then(response => response.json())
.then(data => {

    let catalogue = document.getElementById("catalogue");

    data.forEach(plan => {

        catalogue.innerHTML += `
            <div class="plan"> 
                <h3>${plan.name}</h3> 
                <p>Duration: ${plan.duration}</p> 
                <p>Price: ₹${plan.price}</p> 
                <button onclick="selectPlan('${plan.name}')"> 
                    Select Plan 
                </button> 
            </div>
        `;

    });

})
.catch(error => {
    alert("Error loading membership plans");
});


function selectPlan(plan) { 
    alert(plan + " selected!"); 
} 

</script> 
 
</body> 
</html>
