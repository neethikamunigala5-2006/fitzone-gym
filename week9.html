<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Week 9</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #dbeafe;
        }

        img {
            width: 180px;
            border-radius: 10px;
        }

        .plan {
            display: inline-block;
            width: 180px;
            margin: 10px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        .plan h3 {
            color: darkblue;
        }

        button {
            padding: 10px 20px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<center>

<img src="gymlogo.jpeg">

<h1>FitZone Gym</h1>

<h2>Membership Plans</h2>

<button onclick="load()">Show Plans</button>

<br><br>

<div id="out"></div>

</center>

<script>
function load() {

    fetch("plans.json")
    .then(response => response.json())
    .then(data => {

        data.forEach(plan => {

            document.getElementById("out").innerHTML +=
            `<div class="plan">
                <h3>${plan.name}</h3>
                <p>Price: ${plan.price}</p>
            </div>`;

        });

    });
}
</script>

</body>
</html>
